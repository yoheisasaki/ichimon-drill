<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f1effc"><title>風助の解答履歴（ママ用）</title>
<link rel="stylesheet" href="history.css"></head>
<body><main class="wrap">
<header><a href="mama.html">← ママ用アプリ</a><h1>風助の解答履歴</h1><a href="list.html">問題一覧</a></header>
<p class="intro">問題ごとの正解・間違い・解いた日を確認できます。記録データはこの端末の中だけに保存し、GitHubには送信しません。</p>
<section class="panel" aria-label="記録を読み込む">
<h2>回答記録を読み込む</h2>
<p>Googleスプレッドシート「一問一答_記録」の「シート1」を CSV 形式でダウンロードし、ここで選んでください。</p>
<p><a href="https://docs.google.com/spreadsheets/d/1nbseyDGUxrNvkr45ErNC-OD5bQSJKt8y27GjtsX9ZeM/edit" target="_blank" rel="noopener noreferrer">記録のスプレッドシートを開く</a></p>
<label class="upload">CSVを選ぶ<input type="file" id="file" accept=".csv,text/csv,.tsv,text/tab-separated-values"></label>
<div class="status" id="status">まだ読み込んでいません。</div>
<div class="small">新しい回答を反映する場合は、最新のCSVをもう一度読み込んでください。</div>
</section>
<section class="panel"><h2>問題を探す</h2>
<div class="controls"><select id="subject" aria-label="教科"><option>全部</option><option>国語</option><option>算数</option><option>理科</option><option>社会</option></select><input id="search" type="search" placeholder="問題文・IDで検索"></div>
<label class="only"><input id="missOnly" type="checkbox"> 間違えたことがある問題だけ</label>
<div id="summary" class="summary"></div>
<div id="results" class="results"></div></section>
</main><script src="history.js?v=1"></script></body></html>
