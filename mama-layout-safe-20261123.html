/* ママ用：RPG本体の描画とは独立した上部ナビを常設 */
body.mama-mode .mama-game-nav{
 display:flex;flex:0 0 auto;gap:3px;align-items:stretch;
 padding:5px 6px;background:#0d1630;border-bottom:2px solid #d4af5a;
 position:relative;z-index:2600;
}
body.mama-mode .mama-game-nav button{
 flex:1;min-width:0;padding:10px 2px;min-height:46px;
 border:1px solid #d4af5a;border-radius:8px;background:#192b53;color:white;
 font-size:clamp(11px,3.2vw,15px);font-weight:800;line-height:1.2;
}
body.mama-mode .mama-game-nav button[aria-current="page"]{background:#286d74;border-color:#ffe27a;color:#fff}
body.mama-mode:has(#app>.rs3),body.mama-mode:has(#app>.rw3){
 display:flex!important;flex-direction:column!important;
 height:100dvh!important;min-height:0!important;overflow:hidden!important;
}
body.mama-mode:has(#app>.rs3) .mama-permanent-header,
body.mama-mode:has(#app>.rw3) .mama-permanent-header{
 position:relative!important;top:auto!important;flex:0 0 auto!important;
}
body.mama-mode #app:has(>.rs3),body.mama-mode #app:has(>.rw3){
 flex:1 1 0!important;min-height:0!important;height:auto!important;overflow:hidden!important;
}
body.mama-mode #app>.rs3,body.mama-mode #app>.rw3{height:100%!important;min-height:0!important}

/* ヘッダーにゲームメニューを統合して常時表示 */
body.mama-mode .mama-permanent-header>.mama-game-nav{
 display:grid!important;grid-template-columns:repeat(5,minmax(0,1fr))!important;
 width:100%!important;max-width:550px!important;gap:4px!important;
 margin:7px 0 0!important;padding:0!important;border:0!important;
 background:transparent!important;position:relative!important;z-index:3000!important;
 visibility:visible!important;opacity:1!important;
}
body.mama-mode .mama-permanent-header>.mama-game-nav button{
 display:block!important;min-width:0!important;min-height:45px!important;
 padding:9px 1px!important;font-size:clamp(11px,3.15vw,15px)!important;
 font-weight:900!important;line-height:1.2!important;
 color:#fff!important;background:#233b66!important;
 border:2px solid #ffe27a!important;border-radius:8px!important;
 pointer-events:auto!important;visibility:visible!important;
}
/* ママ用：どの画面でも押せる独立した更新ボタン */
body.mama-mode .mama-header-tools{display:flex;align-items:center;justify-content:space-between;gap:9px;width:100%;position:relative;z-index:5001}
body.mama-mode #mama-refresh{flex:none;display:inline-flex;align-items:center;justify-content:center;min-height:44px;min-width:105px;padding:7px 10px;border:2px solid #fff2b0;border-radius:9px;color:#fff!important;background:#74224d!important;font-size:16px;font-weight:800;position:relative;z-index:5002;pointer-events:auto!important;text-decoration:none!important;touch-action:manipulation}

<body class="mama-mode">
<header class="mama-permanent-header" aria-label="ママ専用アプリ"><div class="mama-header-tools"><strong>🌷 ママ専用アプリ</strong><a id="mama-refresh" href="mama.html?refresh=mama-reload-20261123b" aria-label="母用アプリをさいしんにする">↻ リロード</a></div><nav class="mama-admin-nav" aria-label="ママ用管理メニュー"><a href="mama.html">🎮 ゲーム</a><a href="list.html">📚 問題一覧</a><a href="history.html">📊 風助の履歴</a></nav><nav class="mama-game-nav" aria-label="ママ用ゲームの移動">
<button type="button" data-mama-screen="home">ホーム</button>
<button type="button" data-mama-screen="adv">冒険</button>
<button type="button" data-mama-screen="town">街</button>
<button type="button" data-mama-screen="worldlife">マイワールド</button>
<button type="button" data-mama-screen="me">自分</button>
</nav></header>

<main id="app"></main>
<script>
// 独立した更新処理。RPG本体の起動状態に依存せず、母用セーブや学習記録は消さない。
(function(){
  const btn=document.getElementById('mama-refresh');
  if(!btn)return;
  // 通常のリンクとしても動く。タップ時は新しいURLを設定して古いキャッシュを避ける。
  btn.addEventListener('click',function(){
    const url=new URL(window.location.href);
    url.searchParams.set('refresh',String(Date.now()));
    btn.href=url.toString();
  });
})();
</script>
<script src="rpg/js/rpg-ruby-dict.js"></script>

<script>
  // アプリの更新ボタンはRPG画面・音声コードも同時に最新版へ切り替える。
  const rpgRefreshVersion = new URLSearchParams(location.search).get('refresh') || 'mama-menu-20261123';
  document.write('<script src="rpg/js/rpg-screens.js?v=' + encodeURIComponent(rpgRefreshVersion) + '"><\/script>');
  document.write('<script src="rpg/js/rpg-sound.js?v=' + encodeURIComponent(rpgRefreshVersion) + '"><\/script>');
</script>
<script src="kanji-ruby.js?v=20261121"></script>
<script src="map.js"></script>
<script src="common.js"></script>
<script>
  // 更新ボタンで付けたrefresh値を、app.jsのURLにも反映してキャッシュを回避する。
  // このスクリプトは既存のRPGや学習記録の保存場所には触れない。
  const refreshVersion = new URLSearchParams(location.search).get('refresh') || 'feedback-first-20261123';
  document.write('<script src="app-feedback-first-20261123.js?v=' + encodeURIComponent(refreshVersion) + '"><\/script>');
</script>
<script>
(function(){
  const nav = document.querySelector('.mama-game-nav');
  if(!nav)return;
  nav.addEventListener('click',function(e){
    const button=e.target.closest('[data-mama-screen]');
    if(!button)return;
    const screen=button.dataset.mamaScreen;
    if(screen==='home'){
      if(typeof window.home==='function'){window.home();return;}
      location.href='mama.html?refresh=mama-header-game-nav-20261123v4';
      return;
    }
    if(window.RPG && RPG.ok && typeof RPG.go==='function'){
      RPG.go(screen);
      nav.querySelectorAll('button').forEach(b=>b.removeAttribute('aria-current'));
      button.setAttribute('aria-current','page');
    }else{
      const banner=document.querySelector('.mama-permanent-header strong');
      if(banner)banner.textContent='🌷 ママ専用：冒険を読み込み中';
    }
  });
})();
</script>
