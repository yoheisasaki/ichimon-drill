<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache"><title>間違えた問題一覧</title><style>
*{box-sizing:border-box}body{margin:0;background:#f8f4f6;color:#29212b;font:16px/1.6 system-ui,sans-serif}main{max-width:760px;margin:auto;padding:16px}a{color:#86305d}h1{font-size:24px;margin:12px 0}button,select,input{font:inherit}button,select{padding:10px;border:1px solid #bba7b3;border-radius:8px;background:white;color:#29212b}nav{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}button[aria-pressed=true]{background:#86305d;color:white}article{background:white;border:1px solid #e1d5dc;border-radius:12px;margin:10px 0;padding:14px;overflow-wrap:anywhere}article h3{font-size:18px;margin:7px 0}small{color:#665761}.answer{color:#14603d;font-weight:bold;margin:8px 0}.meta{color:#92264a;font-weight:bold}.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}#status{margin:10px 0}label{display:block;margin:8px 0}details{margin-top:8px}summary{cursor:pointer}h2{font-size:20px}
</style></head><body><main><a href="mama.html">← ママ用アプリ</a><h1>間違えた問題一覧</h1><p>全端末の解答履歴から、不正解・わかんないの問題を表示します。</p><div class="tools"><button id="reload">履歴を再読み込み</button><a href="history.html">全解答履歴</a></div><div id="status" role="status"></div><nav id="subjects" aria-label="教科"></nav><label><input type="checkbox" id="unresolved"> 最後の回答が正解ではない問題だけ</label><label>並び順 <select id="sort"><option value="recent">最近間違えた順</option><option value="count">間違い・わかんないが多い順</option></select></label><div id="results"></div></main>
<script src="common.js"></script><script>
'use strict';
const API='https://script.google.com/macros/s/AKfycbwR6PPGrKn5HL1yJ8-xc_sjV-kaEDY2dv0jD_e7XyRSjQUd2E_2_Pq-rGE6tWxHRj3QFg/exec?api=ichimon_history';
const $=id=>document.getElementById(id);
const subjects=['全部','国語','算数','理科','社会'];
let selected='全部', questions=[], history=null;
const count=h=>Number(h?.wrong||0)+Number(h?.unknown||0);
const lastMiss=h=>(h?.attempts||[]).filter(a=>a[1]==='w'||a[1]==='u').map(a=>String(a[0])).sort().pop()||(h?.last&&h.last.result!=='correct'?String(h.last.at||''):'');
const date=s=>s?String(s).slice(0,16).replace('T',' '):'記録なし';
const safe=s=>esc(plain(s??''));
function render(){
 const rows=history?questions.filter(q=>count(history[q.id])>0):[];
 $('subjects').replaceChildren(...subjects.map(s=>{const b=document.createElement('button');b.textContent=s+(history?' '+rows.filter(q=>s==='全部'||q.subject===s).length+'問':'');b.setAttribute('aria-pressed',String(s===selected));b.onclick=()=>{selected=s;render()};return b}));
 if(!history){$('results').textContent='履歴を取得できるまで件数は表示しません。';return}
 let shown=rows.filter(q=>(selected==='全部'||q.subject===selected)&&(!$('unresolved').checked||history[q.id].last?.result!=='correct'));
 shown.sort((a,b)=>{const x=history[a.id],y=history[b.id];return ($('sort').value==='count'?count(y)-count(x):0)||lastMiss(y).localeCompare(lastMiss(x))});
 $('results').innerHTML='<p>'+shown.length+'問（同じ問題は1件）</p>'+ (shown.length?subjects.slice(1).map(s=>{const list=shown.filter(q=>q.subject===s);return list.length?'<h2>'+s+' '+list.length+'問</h2>'+list.map(q=>{const h=history[q.id];const status=h.last?.result==='correct'?'最後は正解':h.last?.result==='unknown'?'最後はわかんない':h.last?.result==='wrong'?'最後は不正解':'最後の結果不明';return '<article><small>'+safe(q.unit)+'</small><h3>'+safe(q.q)+'</h3><div class="answer">正解：'+safe(q.a)+'</div><div class="meta">不正解 '+Number(h.wrong||0)+'回 ／ わかんない '+Number(h.unknown||0)+'回</div><div>最後の間違い：'+safe(date(lastMiss(h)))+'</div><div>'+status+' ／ 正解 '+Number(h.correct||0)+'回</div>'+(q.exp?'<details><summary>解説を見る</summary>'+safe(q.exp)+'</details>':'')+'<p><a href="history.html?qid='+encodeURIComponent(q.id)+'">詳しい解答履歴</a></p></article>'}).join(''):''}).join(''):'<p>該当する問題はありません。</p>');
 const unknownIds=Object.keys(history).filter(id=>count(history[id])>0&&!questions.some(q=>q.id===id)).length;
 if(unknownIds)$('results').insertAdjacentHTML('beforeend','<p>現在の問題データにない履歴：'+unknownIds+'問（一覧対象外）</p>');
}
async function load(){history=null;render();$('reload').disabled=true;$('status').textContent='履歴を取得中…';const ctrl=new AbortController();const t=setTimeout(()=>ctrl.abort(),15000);try{const [d,h,c]=await Promise.all([fetch('data/questions.json',{cache:'no-store',signal:ctrl.signal}).then(r=>{if(!r.ok)throw Error();return r.json()}),fetch(API+'&t='+Date.now(),{cache:'no-store',signal:ctrl.signal}).then(r=>{if(!r.ok)throw Error();return r.json()}),loadConf()]);if(!Array.isArray(d.questions)||h.ok!==true||!h.questions||typeof h.questions!=='object')throw Error();questions=applyEdits(d.questions,c);history=h.questions;$('status').textContent='履歴取得済み：'+new Date().toLocaleString('ja-JP');}catch(e){$('status').textContent='履歴を取得できませんでした。再読み込みしてください。';}finally{clearTimeout(t);$('reload').disabled=false;render()}}
$('reload').onclick=load;$('sort').onchange=render;$('unresolved').onchange=render;load();
</script></body></html>
